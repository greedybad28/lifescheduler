<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Life System Calendar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <p>Syncing with cloud...</p>
        </div>

        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <h1>📅 Life System</h1>
                <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                    <div id="userProfile" class="user-profile" style="display: none;">
                        <span class="user-avatar">👤</span>
                        <span id="usernameDisplay" class="username-display"></span>
                        <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
                    </div>
                    <span id="syncStatus" class="sync-status">📡 Synced</span>
                    <button class="theme-toggle" id="themeToggle">🌙</button>
                </div>
            </div>
            <p class="subtitle">Daily Tasks & Schedule Logger (Cloud Synced)</p>
        </header>

        <!-- Navigation -->
        <nav class="nav-controls">
            <button id="prevWeek" class="nav-btn">← Previous</button>
            <div class="date-display">
                <span id="currentDate"></span>
            </div>
            <button id="nextWeek" class="nav-btn">Next →</button>
            <button id="todayBtn" class="nav-btn today-btn">Today</button>
        </nav>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="view-btn active" data-view="week">Week</button>
            <button class="view-btn" data-view="day">Day</button>
        </div>

        <!-- Calendar Section -->
        <main class="calendar-section">
            <!-- Week View -->
            <div id="weekView" class="view active">
                <div class="week-grid" id="weekGrid"></div>
            </div>

            <!-- Day View -->
            <div id="dayView" class="view">
                <div class="day-detail" id="dayDetail"></div>
            </div>
        </main>

        <!-- Add Task Modal -->
        <div id="taskModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Task</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskDate">Date:</label>
                        <input type="date" id="taskDate" required>
                    </div>
                    <div class="form-group">
                        <label for="taskTime">Time:</label>
                        <input type="time" id="taskTime" required>
                    </div>
                    <div class="form-group">
                        <label for="taskTitle">Task Title:</label>
                        <input type="text" id="taskTitle" placeholder="Enter task..." required>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Category:</label>
                        <select id="taskCategory" required>
                            <option value="">Select category...</option>
                            <option value="teaching">Music Teaching</option>
                            <option value="internship">Internship</option>
                            <option value="music-prod">Music Production</option>
                            <option value="coding">Coding</option>
                            <option value="piano">Piano</option>
                            <option value="gym">Gym</option>
                            <option value="personal">Personal</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status:</label>
                        <select id="taskStatus" required>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskNotes">Notes (optional):</label>
                        <textarea id="taskNotes" placeholder="Add notes..."></textarea>
                    </div>
                    <div class="form-group" id="scheduleNotesSection" style="display: none;">
                        <label for="scheduleBlockNotes">Log Entry / Notes:</label>
                        <textarea id="scheduleBlockNotes" placeholder="What did you accomplish? Any notes for this time block..."></textarea>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Task</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">Delete Task</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Quick Add Button (Floating) -->
        <button id="addTaskBtn" class="fab">+</button>

        <!-- Premium Auth Modal (Overlay) -->
        <div id="authModal" class="auth-modal" style="display: none;">
            <div class="auth-container">
                <div class="auth-logo">📅</div>
                <h2 id="authTitle" class="auth-title">Log In</h2>
                <p id="authSubtitle" class="auth-subtitle">Access your personal Life System schedule</p>
                
                <div class="auth-error" id="authError"></div>
                
                <form id="authForm">
                    <div class="auth-input-group">
                        <label for="authUsername">Username</label>
                        <input type="text" id="authUsername" class="auth-input" placeholder="e.g. john_doe" required autocomplete="username">
                    </div>
                    <div class="auth-input-group">
                        <label for="authPassword">Password</label>
                        <input type="password" id="authPassword" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="authSubmitBtn" class="auth-btn">Log In</button>
                </form>
                
                <div class="auth-toggle">
                    <span id="authToggleText">Don't have an account?</span>
                    <a id="authToggleLink" class="auth-toggle-link">Sign Up</a>
                </div>
                
                <button id="authGuestBtn" class="auth-guest-btn">Use Offline (Guest Mode)</button>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script-firebase.js"></script>
</body>
</html>
